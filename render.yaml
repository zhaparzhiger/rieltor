# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
# Значения с sync: false Render спросит при создании — они не хранятся в git.
services:
  - type: web
    name: rieltor
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_USE_VERTEX
        value: "1"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      # Всё содержимое google-key.json одной строкой.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Альтернатива Vertex: ключ Google AI Studio (тогда GEMINI_USE_VERTEX=0).
      - key: GEMINI_API_KEY
        sync: false
      # Необязательно: своя сессия Krisha, чтобы подтягивались телефоны.
      - key: KRISHA_COOKIE
        sync: false
